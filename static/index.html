<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediSight v3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- Auth guard: redirect to /login if no valid token -->
    <script>
      (function () {
        var token = localStorage.getItem('medisight_token');
        if (!token) { window.location.replace('/login'); return; }
        // Async verify — if the token has been invalidated, kick the user out
        fetch('/api/auth/verify', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(function (r) { if (!r.ok) { localStorage.removeItem('medisight_token'); window.location.replace('/login'); } })
          .catch(function () {});
        // Expose logout helper for the React header
        window.medisightLogout = function () {
          fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
          }).finally(function () {
            localStorage.removeItem('medisight_token');
            localStorage.removeItem('medisight_user');
            window.location.replace('/login');
          });
        };
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
        user-select: none;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="root">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          flex-direction: column;
          gap: 16px;
          font-family: sans-serif;
          color: #64748b;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
        <span style="font-size: 14px">Loading MediSight...</span>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <script type="text/babel">
      const { useState, useEffect, useCallback, useRef } = React;
      const {
        LineChart,
        Line,
        BarChart,
        Bar,
        ScatterChart,
        Scatter,
        PieChart,
        Pie,
        Cell,
        XAxis,
        YAxis,
        CartesianGrid,
        Tooltip,
        Legend,
        ResponsiveContainer,
        AreaChart,
        Area,
        ComposedChart,
      } = Recharts;
      // Icon components using Material Symbols (Google Fonts) — no CDN dependency issues
      function _ms(name) {
        return function Icon({
          size = 24,
          color = "currentColor",
          opacity = 1,
        }) {
          return (
            <span
              className="material-symbols-outlined"
              style={{
                fontSize: size,
                color: color,
                opacity: opacity,
                lineHeight: 1,
                display: "inline-block",
                verticalAlign: "middle",
                flexShrink: 0,
              }}
            >
              {name}
            </span>
          );
        };
      }
      const Activity = _ms("vital_signs");
      const AlertTriangle = _ms("warning");
      const Users = _ms("group");
      const Heart = _ms("favorite");
      const TrendingUp = _ms("trending_up");
      const Brain = _ms("psychology");
      const Layers = _ms("layers");
      const Zap = _ms("bolt");
      const MapIcon = _ms("map");
      const BarChart2 = _ms("bar_chart");
      const Shield = _ms("shield");
      const Bell = _ms("notifications");
      const Settings = _ms("settings");
      const Clock = _ms("schedule");
      const Database = _ms("database");
      const GitBranch = _ms("account_tree");
      const ChevronRight = _ms("chevron_right");
      const RefreshCw = _ms("refresh");
      const Network = _ms("hub");
      const Cpu = _ms("memory");
      const ArrowUpRight = _ms("north_east");
      const Eye = _ms("visibility");
      const Stethoscope = _ms("stethoscope");

      // ─────────────────────────────────────────────
      // CONSTANTS
      // ─────────────────────────────────────────────
      const API = "http://127.0.0.1:5000/api";
      const CLR = {
        blue: "#2563eb",
        red: "#dc2626",
        amber: "#d97706",
        green: "#16a34a",
        teal: "#0d9488",
        purple: "#7c3aed",
      };
      const LT = {
        blue: "#eff6ff",
        red: "#fef2f2",
        amber: "#fffbeb",
        green: "#f0fdf4",
        teal: "#f0fdfa",
        purple: "#f5f3ff",
      };
      const PALETTE = [
        CLR.blue,
        CLR.red,
        CLR.amber,
        CLR.green,
        CLR.teal,
        CLR.purple,
      ];

      // ─────────────────────────────────────────────
      // UTILITIES
      // ─────────────────────────────────────────────
      async function apiFetch(path) {
        try {
          const r = await fetch(API + path);
          if (!r.ok) throw new Error();
          return r.json();
        } catch {
          return null;
        }
      }

      const statusClr = (pct) =>
        pct >= 85 ? CLR.red : pct >= 70 ? CLR.amber : CLR.green;
      const n = (v) => (v ?? 0).toLocaleString();

      const GLOBAL_CSS = `
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Outfit', sans-serif; background: #f0f4f8; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp { from { opacity:0;transform:translateY(8px) } to { opacity:1;transform:translateY(0) } }
      @keyframes scrollTicker { 0% { transform:translateX(0) } 100% { transform:translateX(-50%) } }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      .section-enter { animation: fadeUp 0.3s ease; }
    `;

      // ─────────────────────────────────────────────
      // SHARED COMPONENTS
      // ─────────────────────────────────────────────
      function Spin({ msg = "Loading…" }) {
        return (
          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: 10,
              color: "#94a3b8",
              fontSize: 13,
              padding: "20px 0",
            }}
          >
            <div
              style={{
                width: 18,
                height: 18,
                border: "2.5px solid #e2e8f0",
                borderTopColor: CLR.blue,
                borderRadius: "50%",
                animation: "spin 0.8s linear infinite",
                flexShrink: 0,
              }}
            />
            {msg}
          </div>
        );
      }

      function Empty({ msg = "No data available" }) {
        return (
          <div
            style={{
              color: "#94a3b8",
              fontSize: 13,
              padding: "20px 0",
              textAlign: "center",
            }}
          >
            {msg}
          </div>
        );
      }

      function Card({ children, style = {} }) {
        return (
          <div
            style={{
              background: "#fff",
              border: "1px solid #e2e8f0",
              borderRadius: 12,
              boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
              overflow: "hidden",
              ...style,
            }}
          >

          </div>

      }

      function CardHd({ title, sub, badge, bc = "blue" }) {
        return (
          <div
            style={{
              padding: "14px 18px",
              borderBottom: "1px solid #e2e8f0",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: 12,
            }}

            <div>
              <div
                style={{ fontSize: 13.5, fontWeight: 600, color: "#0f172a" }}

                {title}
              </div>
              {sub && (
                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 2 }}>
                  {sub}
                </div>
              )}
            </div>
            {badge && (
              <span
                style={{
                  background: LT[bc] || "#f1f5f9",
                  color: CLR[bc] || "#64748b",
                  fontSize: 11,
                  fontWeight: 600,
                  padding: "3px 10px",
                  borderRadius: 20,
                  whiteSpace: "nowrap",
                }}
              >
                {badge}
              </span>
            )}
          </div>
        );
      }

      function StatPill({ label, value, color, bg }) {
        return (
          <div
            style={{
              background: bg || LT.blue,
              borderRadius: 8,
              padding: "8px 14px",
              border: `1px solid ${color || CLR.blue}22`,
            }}
          >
            <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 2 }}>
              {label}
            </div>
            <div
              style={{
                fontSize: 16,
                fontWeight: 700,
                color: color || CLR.blue,
                fontFamily: "'IBM Plex Mono', monospace",
              }}
            >
              {value}
            </div>
          </div>
        );
      }

      function KpiCard({ color = "blue", Icon, value, label, badge, foot }) {
        return (
          <div
            style={{
              background: "#fff",
              border: "1px solid #e2e8f0",
              borderRadius: 12,
              padding: "18px 18px 16px",
              boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
              borderTop: `3px solid ${CLR[color]}`,
            }}
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "flex-start",
                marginBottom: 12,
              }}
            >
              <div
                style={{
                  background: LT[color],
                  borderRadius: 8,
                  width: 38,
                  height: 38,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                <Icon size={18} color={CLR[color]} />
              </div>
              {badge && (
                <span
                  style={{
                    fontSize: 10.5,
                    fontWeight: 600,
                    padding: "3px 8px",
                    borderRadius: 20,
                    background: "#fecaca",
                    color: CLR.red,

                  {badge}

            </div>
            <div
              style={{
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 26,
                fontWeight: 600,
                letterSpacing: -1,

                marginBottom: 4,

            >
              {value}

            <div style={{ fontSize: 12, color: "#64748b" }}>{label}</div>
            {foot && (

                style={{
                  marginTop: 10,
                  paddingTop: 10,
                  borderTop: "1px solid #e2e8f0",
                  fontSize: 11,
                  color: "#94a3b8",

      }

      function Tag({ children, color = "blue" }) {
        return (
          <span
            style={{
              background: LT[color] || "#f1f5f9",
              color: CLR[color] || "#64748b",
              fontSize: 11,
              fontWeight: 600,
              padding: "3px 10px",
              borderRadius: 20,
              display: "inline-block",
            }}
          >
            {children}
          </span>
        );
      }

      function Grid2({ children, style = {} }) {
        return (
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: 16,
              marginBottom: 16,
              ...style,
            }}
          >
            {children}
          </div>
        );
      }

      function SectionHd({ title, desc }) {
        return (
          <div style={{ marginBottom: 20 }}>
            <div
              style={{
                fontSize: 20,
                fontWeight: 700,
                color: "#0f172a",
                letterSpacing: -0.4,
                marginBottom: 2,
              }}
            >
              {title}
            </div>
            <div style={{ fontSize: 13, color: "#64748b" }}>{desc}</div>
          </div>

      }

      const CT = ({ children }) => (
        <div style={{ padding: 18 }}>{children}</div>
      );

      // ─────────────────────────────────────────────
      // SIDEBAR
      // ─────────────────────────────────────────────
      const NAV = [
        {
          group: "Overview",
          items: [{ id: "dashboard", Icon: Activity, label: "Dashboard" }],
        },
        {
          group: "Analytics",
          items: [
            { id: "capacity", Icon: BarChart2, label: "Capacity" },
            { id: "prediction", Icon: TrendingUp, label: "Prediction" },
            { id: "outbreak", Icon: AlertTriangle, label: "Outbreak Monitor" },
            { id: "heatmap", Icon: MapIcon, label: "State Heatmap" },
          ],
        },
        {
          group: "Operations",
          items: [
            { id: "resources", Icon: Layers, label: "Resources" },
            { id: "scenario", Icon: Zap, label: "Scenarios" },
          ],
        },
        {
          group: "Intelligence",
          items: [{ id: "ml", Icon: Brain, label: "ML Intelligence" }],
        },
      ];

      const SEC_LABELS = {
        dashboard: "Overview Dashboard",
        capacity: "Bed & Capacity Management",
        prediction: "Admission Forecasting",
        outbreak: "Outbreak Monitor",
        heatmap: "State-Level Heatmap",
        resources: "Resource Allocation",
        scenario: "Emergency Scenarios",
        ml: "ML Intelligence Suite",
      };

      function Sidebar({ active, onNav, alertCount }) {
        return (
          <div
            style={{
              position: "fixed",
              left: 0,
              top: 0,
              bottom: 0,
              width: 236,
              background: "#0f1e3a",
              display: "flex",
              flexDirection: "column",
              zIndex: 200,
              overflowY: "auto",
            }}
          >
            <div
              style={{
                padding: "20px 20px 18px",
                borderBottom: "1px solid rgba(255,255,255,0.08)",
                display: "flex",
                alignItems: "center",
                gap: 11,
              }}
            >
              <div
                style={{
                  width: 36,
                  height: 36,
                  borderRadius: 10,
                  background: CLR.blue,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  flexShrink: 0,
                }}
              >
                <Activity size={18} color="#fff" />
              </div>
              <div>
                <div
                  style={{
                    fontSize: 17,
                    fontWeight: 700,
                    color: "#fff",
                    letterSpacing: -0.3,
                  }}
                >
                  MediSight
                </div>
                <div
                  style={{
                    fontSize: 10,
                    color: "rgba(255,255,255,0.3)",
                    letterSpacing: 0.5,
                  }}
                >
                  Hospital Intelligence v3
                </div>
              </div>
            </div>

            <div style={{ flex: 1, padding: "8px 10px" }}>
              {NAV.map(({ group, items }) => (
                <div key={group} style={{ marginBottom: 4 }}>
                  <div
                    style={{
                      fontSize: 10,
                      fontWeight: 600,
                      letterSpacing: 1,
                      textTransform: "uppercase",
                      color: "rgba(255,255,255,0.28)",
                      padding: "12px 10px 6px",
                    }}
                  >
                    {group}
                  </div>
                  {items.map(({ id, Icon, label }) => (
                    <div
                      key={id}
                      onClick={() => onNav(id)}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 9,
                        padding: "9px 10px",
                        borderRadius: 8,
                        cursor: "pointer",
                        marginBottom: 1,
                        background: active === id ? CLR.blue : "transparent",
                        color: active === id ? "#fff" : "rgba(255,255,255,0.6)",
                        fontWeight: active === id ? 500 : 400,
                        fontSize: 13.5,
                        transition: "all 0.15s",
                      }}
                    >
                      <Icon size={16} opacity={active === id ? 1 : 0.8} />
                      <span style={{ flex: 1 }}>{label}</span>
                      {id === "ml" && (
                        <span
                          style={{
                            background: CLR.blue,
                            color: "#fff",
                            fontSize: 10,
                            fontWeight: 700,
                            padding: "2px 6px",
                            borderRadius: 10,
                          }}
                        >
                          12
                        </span>
                      )}
                      {id === "outbreak" && alertCount > 0 && (
                        <span
                          style={{
                            background: "#ef4444",
                            color: "#fff",
                            fontSize: 10,
                            fontWeight: 700,
                            padding: "2px 7px",
                            borderRadius: 20,
                          }}
                        >
                          {alertCount}
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              ))}
            </div>

            <div
              style={{
                padding: 16,
                borderTop: "1px solid rgba(255,255,255,0.08)",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div
                  style={{
                    width: 7,
                    height: 7,
                    borderRadius: "50%",
                    background: "#22c55e",
                  }}
                />
                <span
                  style={{ fontSize: 11.5, color: "rgba(255,255,255,0.4)" }}
                >
                  System Online
                </span>
              </div>
              <div
                style={{
                  fontSize: 10,
                  color: "rgba(255,255,255,0.2)",
                  marginTop: 4,
                }}
              >
                MySQL primary · CSV fallback
              </div>
            </div>
          </div>
        );
      }

      // ─────────────────────────────────────────────
      // HEADER + ALERT BAR
      // ─────────────────────────────────────────────
      function Header({ section, time }) {
        return (
          <div
            style={{
              height: 60,
              background: "#fff",
              borderBottom: "1px solid #e2e8f0",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              padding: "0 28px",
              position: "sticky",
              top: 0,
              zIndex: 100,
              boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
            }}
          >
            <div>
              <div style={{ fontSize: 11.5, color: "#94a3b8" }}>
                MediSight / {SEC_LABELS[section]}
              </div>
              <div
                style={{
                  fontSize: 15.5,
                  fontWeight: 600,
                  color: "#0f172a",
                  letterSpacing: -0.2,
                }}
              >
                {SEC_LABELS[section]}
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div
                style={{
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 13,
                  color: "#64748b",
                  background: "#f7f9fc",
                  border: "1px solid #e2e8f0",
                  padding: "5px 12px",
                  borderRadius: 8,
                }}
              >
                {time}
              </div>
              <div
                style={{
                  width: 36,
                  height: 36,
                  borderRadius: 8,
                  border: "1px solid #e2e8f0",
                  background: "#f7f9fc",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                }}
              >
                <Bell size={15} color="#64748b" />
              </div>
              <div
                title="Logout"
                onClick={() => window.medisightLogout && window.medisightLogout()}
                style={{
                  width: 36,
                  height: 36,
                  borderRadius: 8,
                  border: "1px solid #e2e8f0",
                  background: "#f7f9fc",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                }}
              >
                <span
                  className="material-symbols-outlined"
                  style={{ fontSize: 17, color: "#64748b" }}
                >logout</span>
              </div>
              <div
                style={{
                  width: 36,
                  height: 36,
                  borderRadius: "50%",
                  background: CLR.blue,
                  color: "#fff",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 13,
                  fontWeight: 600,
                  cursor: "pointer",
                }}
              >
                {(localStorage.getItem('medisight_user') || 'MS').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || 'MS'}
              </div>
            </div>
          </div>
        );
      }

      function AlertBar({ ticker }) {
        if (!ticker) return null;
        const doubled = ticker + " | " + ticker;
        return (
          <div
            style={{
              background: "#fffbeb",
              borderBottom: "1px solid #fde68a",
              padding: "8px 28px",
              display: "flex",
              alignItems: "center",
              gap: 12,
              overflow: "hidden",
            }}
          >
            <span
              style={{
                background: "#f59e0b",
                color: "#fff",
                fontSize: 9.5,
                fontWeight: 700,
                padding: "2px 8px",
                borderRadius: 4,
                letterSpacing: 0.8,
                textTransform: "uppercase",
                flexShrink: 0,
              }}
            >
              LIVE
            </span>
            <div style={{ overflow: "hidden", flex: 1 }}>
              <div
                style={{
                  display: "inline-block",
                  whiteSpace: "nowrap",
                  color: "#92400e",
                  fontSize: 12.5,
                  animation: "scrollTicker 40s linear infinite",
                }}
              >
                {doubled}
              </div>
            </div>
          </div>
        );
      }

      // ─────────────────────────────────────────────
      // SECTION: DASHBOARD
      // ─────────────────────────────────────────────
      function DashboardSection({ onAlertsLoad }) {
        const [kpis, setKpis] = useState(null);
        const [alerts, setAlerts] = useState(null);
        const [resources, setRes] = useState(null);
        const [forecast, setFc] = useState(null);
        const [trends, setTrends] = useState(null);

        useEffect(() => {
          (async () => {
            const [k, a, r, f, t] = await Promise.all([
              apiFetch("/dashboard/kpis"),
              apiFetch("/dashboard/alerts"),
              apiFetch("/dashboard/resources"),
              apiFetch("/prediction/forecast?days=14"),
              apiFetch("/outbreak/trends"),
            ]);
            setKpis(k);
            setAlerts(a);
            setRes(r);
            setFc(f);
            setTrends(t);
            if (a)
              onAlertsLoad?.(a.filter((x) => x.severity === "critical").length);
          })();
        }, []);

        const inflowData = forecast
          ? [
              ...(forecast.actual || []).slice(-30),
              ...(forecast.predicted || []),
            ].map((d) => ({
              date: d.date.slice(5),
              actual: d.type === "actual" ? d.count : null,
              predicted: d.type === "predicted" ? d.count : null,
            }))

      function MLSection() {
        const [m1, setM1] = useState(null);
        const [m2, setM2] = useState(null);
        const [m3, setM3] = useState(null);
        const [m4, setM4] = useState(null);
        const [m5, setM5] = useState(null);
        const [m6, setM6] = useState(null);
        const [m7, setM7] = useState(null);
        const [m8, setM8] = useState(null);
        const [m9, setM9] = useState(null);
        const [m10, setM10] = useState(null);
        const [m11, setM11] = useState(null);
        const [m12, setM12] = useState(null);
        const [m5Disease, setM5Disease] = useState(null);

        useEffect(() => {
          (async () => {
            const [a, b, c, d, e, f, g, h, j, k, l, m] = await Promise.all([
              apiFetch("/prediction/forecast?days=14"),
              apiFetch("/ml/disease-risk"),
              apiFetch("/ml/anomalies"),
              apiFetch("/ml/clusters?k=4"),
              apiFetch("/ml/bed-demand?days=14&top_n=5"),
              apiFetch("/ml/workload?days=14"),
              apiFetch("/ml/outbreak-warning?window=7&z_threshold=2.0"),
              apiFetch("/ml/readmission"),
              apiFetch("/ml/survival"),
              apiFetch("/ml/cost-prediction"),
              apiFetch(
                "/ml/monte-carlo?case_increase=30&severe_ratio=15&zones=2",
              ),
              apiFetch("/ml/symptom-classifier"),
            ]);
            setM1(a);
            setM2(b);
            setM3(c);
            setM4(d);
            setM5(e);
            setM6(f);
            setM7(g);
            setM8(h);
            setM9(j);
            setM10(k);
            setM11(l);
            setM12(m);
            if (e?.diseases) setM5Disease(Object.keys(e.diseases)[0]);
          })();
        }, []);

        const m1Data = m1
          ? [...(m1.actual || []), ...(m1.predicted || [])].map((d) => ({
              date: d.date.slice(5),
              actual: d.type === "actual" ? d.count : null,
              predicted: d.type === "predicted" ? d.count : null,
            }))
          : [];
        const m1PredCounts = m1?.predicted?.map((d) => d.count) || [];

        const normalData =
          m3?.normal?.map((d) => ({
            date: d.date.slice(5),
            count: d.count,
            score: d.score,
          })) || [];
        const anomData =
          m3?.anomalies?.map((d) => ({
            date: d.date.slice(5),
            count: d.count,
            score: d.score,
          })) || [];

        const m5Diseases = m5?.diseases ? Object.keys(m5.diseases) : [];
        const activeDis = m5Disease || m5Diseases[0];

                                  fontWeight: 700,
                                  color: CLR.purple,
                                }}
                              >
                                {ex.predicted_disease}
                              </div>
                              <Tag color="purple">{ex.confidence}%</Tag>
                            </div>
                            <div style={{ fontSize: 11, color: "#64748b" }}>
                              {(ex.top3_predictions || []).map((p, j) => (
                                <span key={j} style={{ marginRight: 10 }}>
                                  {p.disease}{" "}
                                  <strong style={{ color: "#0f172a" }}>
                                    {p.prob}%
                                  </strong>
                                </span>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                      <div>
                        <div
                          style={{
                            fontSize: 12,
                            fontWeight: 600,
                            color: "#334155",
                            marginBottom: 10,
                          }}
                        >
                          Top Terms per Disease
                        </div>
                        <div style={{ maxHeight: 300, overflowY: "auto" }}>
                          {Object.entries(m12.top_terms_per_disease || {})
                            .slice(0, 8)
                            .map(([disease, terms], i) => (
                              <div key={i} style={{ marginBottom: 12 }}>
                                <div
                                  style={{
                                    fontSize: 11,
                                    fontWeight: 700,
                                    color: PALETTE[i % 6],
                                    marginBottom: 4,
                                  }}
                                >
                                  {disease}
                                </div>
                                <div
                                  style={{
                                    display: "flex",
                                    flexWrap: "wrap",
                                    gap: 4,
                                  }}
                                >
                                  {(terms || []).map((term, j) => (
                                    <span
                                      key={j}
                                      style={{
                                        background: Object.values(LT)[i % 6],
                                        color: PALETTE[i % 6],
                                        fontSize: 10,
                                        padding: "2px 7px",
                                        borderRadius: 12,
                                        fontWeight: 500,
                                      }}
                                    >
                                      {term}
                                    </span>
                                  ))}
                                </div>
                              </div>
                            ))}
                        </div>
                      </div>
                    </Grid2>
                  </>
                ) : (
                  <Spin msg="Training NLP classifier…" />
                )}
              </CT>
            </Card>
          </div>
        );
      }

      // ─────────────────────────────────────────────
      // MAIN APP
      // ─────────────────────────────────────────────
      function App() {
        const [section, setSection] = useState("dashboard");
        const [loaded, setLoaded] = useState(new Set(["dashboard"]));
        const [ticker, setTicker] = useState(null);
        const [alertCount, setAlertCount] = useState(0);
        const [time, setTime] = useState(
          new Date().toLocaleTimeString("en-IN", { hour12: false }),
        );

        useEffect(() => {
          const t = setInterval(
            () =>
              setTime(
                new Date().toLocaleTimeString("en-IN", { hour12: false }),
              ),
            1000,
          );
          return () => clearInterval(t);
        }, []);

        const navigate = (id) => {
          setSection(id);
          setLoaded((prev) => new Set([...prev, id]));
        };

        const handleAlertsLoad = (alerts) => {
          if (alerts?.length) {
            const t = alerts
              .map(
                (a) =>
                  `⚠ ${a.disease} surge in ${a.region} — ${n(a.count)} admitted`,
              )
              .join("   |   ");
            setTicker(t);
            setAlertCount(
              alerts.filter((a) => a.severity === "critical").length,
            );
          }
        };

        return (
          <div
            style={{
              display: "flex",
              minHeight: "100vh",
              background: "#f0f4f8",
              fontFamily: "'Outfit', sans-serif",
              fontSize: 14,
            }}
          >
            <style>{GLOBAL_CSS}</style>
            <Sidebar
              active={section}
              onNav={navigate}
              alertCount={alertCount}
            />
            <main
              style={{
                marginLeft: 236,
                flex: 1,
                display: "flex",
                flexDirection: "column",
                minHeight: "100vh",
              }}
            >
              <Header section={section} time={time} />
              <AlertBar ticker={ticker} />
              <div style={{ padding: "24px 28px", flex: 1 }}>
                {section === "dashboard" && (
                  <DashboardSection onAlertsLoad={handleAlertsLoad} />
                )}
                {section === "capacity" && loaded.has("capacity") && (
                  <CapacitySection />
                )}
                {section === "prediction" && loaded.has("prediction") && (
                  <PredictionSection />
                )}
                {section === "outbreak" && loaded.has("outbreak") && (
                  <OutbreakSection />
                )}
                {section === "heatmap" && loaded.has("heatmap") && (
                  <HeatmapSection />
                )}
                {section === "resources" && loaded.has("resources") && (
                  <ResourcesSection />
                )}
                {section === "scenario" && loaded.has("scenario") && (
                  <ScenarioSection />
                )}
                {section === "ml" && loaded.has("ml") && <MLSection />}
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
